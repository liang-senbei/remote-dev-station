# remote-dev-station OOM 硬化基线（→ /etc/sysctl.d/99-oom.conf）
# 场景：中小内存机上挂多个 1M-context claude 会话。直击实测失败模式——
# 单会话 RAM 暴涨、swap 却空：swappiness 太低时内核宁可硬 OOM 也不换页。
#
# swappiness=80（2026-07 从 60 上调）：配合"闲 agent 睡 swap"策略——不常动但要留着的
# 会话让内核积极换页进 swap、把 RAM 让给在干活的,需要时唤醒再换回。要 swap 够大(建议
# ≥RAM),且 earlyoom 别抢在 swap 见底前开枪(见 earlyoom.default 的 -s 调整)。
vm.overcommit_memory=1
vm.swappiness=80
